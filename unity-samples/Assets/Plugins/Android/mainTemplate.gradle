apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.firebase:firebase-messaging:25.1.1'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    // The Braze AARs are included as local files, so Gradle does not auto-resolve their
    // Maven transitive dependencies. The versions below are kept in sync with the
    // android-sdk-base POM by scripts/update_android.rb — do not edit manually.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
**DEPS**}

android {
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"
    namespace '**NAMESPACE**'
    compileSdk **APIVERSION**

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDKVERSION**
        targetSdk **TARGETSDKVERSION**
        ndk {
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
            abiFilters **ABIFILTERS**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING_OPTIONS**
}**REPOSITORIES**
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.google.gms:google-services:4.5.0"
    }
}

apply plugin: 'com.google.gms.google-services'

task copyGoogleServicesJson(type: Copy) {
    def unityProjectPath = $/file:///**DIR_UNITYPROJECT**/$.replace("\\", "/")
    from unityProjectPath + '/Assets/google-services.json'
    into projectDir
}

preBuild.dependsOn(copyGoogleServicesJson)

// Gradle 8.x strict task validation: ':launcher:collect*Dependencies' reads from
// libs/ inside unityLibrary's projectDir, which is the same directory
// copyGoogleServicesJson writes to. Declare an explicit dependency to satisfy
// Gradle's implicit dependency detection.
gradle.projectsEvaluated {
    rootProject.allprojects { proj ->
        proj.tasks.configureEach { task ->
            if (task.name.startsWith('collect') && task.name.endsWith('Dependencies')) {
                task.dependsOn ':unityLibrary:copyGoogleServicesJson'
            }
        }
    }
}
